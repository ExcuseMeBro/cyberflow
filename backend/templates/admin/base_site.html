{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | CyberFlow Admin{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}" style="color: #8b5cf6; font-weight: bold;">
        CyberFlow Admin
    </a>
</h1>
{% endblock %}

{% block extrahead %}
{{ block.super }}
<link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css" rel="stylesheet" type="text/css" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
    :root {
        --primary: #8b5cf6;
        --primary-dark: #7c3aed;
        --primary-light: #a78bfa;
    }

    #header {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    }

    .module h2, .module caption, .inline-group h2 {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    }

    a:link, a:visited {
        color: var(--primary);
    }

    a:hover {
        color: var(--primary-dark);
    }

    .button, input[type=submit], input[type=button], .submit-row input, button {
        background: var(--primary);
        border-color: var(--primary-dark);
    }

    .button:hover, input[type=submit]:hover, input[type=button]:hover, .submit-row input:hover, button:hover {
        background: var(--primary-dark);
    }

    .selector-chosen h2 {
        background: var(--primary) !important;
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
</style>
{% endblock %}
